# ============================================================================
#  OpenRotas Desktop — build do instalador Windows na NUVEM do GitHub (grátis).
#
#  Roda num runner WINDOWS do GitHub Actions (sem precisar do seu PC, sem cartão),
#  empacota o app (PyInstaller onedir), gera o instalador (Inno Setup) e publica o
#  "OpenRotas Setup.exe" como ARTEFATO para download.
#
#  Como usar: GitHub → aba Actions → "build-desktop" → "Run workflow" (escolha o branch) →
#  aguarde (~15-30 min) → baixe o artefato "OpenRotas-Setup".
#
#  Só mexe na edição desktop (pasta desktop/). NÃO afeta a aplicação web.
# ============================================================================
name: build-desktop

on:
  workflow_dispatch:
    inputs:
      embed_graph:
        description: "Embutir o grafo OSRM do Brasil no instalador (fica com vários GB)"
        type: boolean
        default: false
      graph_tag:
        description: "Tag da Release com o grafo (quando embed_graph=true)"
        default: "osrm-brasil-latest"
      publicar_release:
        description: "Publicar o instalador numa Release (habilita o auto-update do app §19)"
        type: boolean
        default: false
      app_release_tag:
        description: "Tag da Release do app (quando publicar_release=true)"
        default: "app-latest"
      osrm_bin_tag:
        description: "Versão do motor OSRM nativo (sem Docker) a embarcar — e-kotov/osrm-binaries. DEVE casar com a VERSÃO do grafo (osrm_image em build-osrm-graph)."
        default: "v6.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reassemblar bases nacionais grandes (drenagem/rodovias)
        shell: pwsh
        run: python montar_bases_grandes.py

      - name: Instalar dependências do desktop
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements-desktop.txt

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Gerar ícone do app/instalador (§38)
        shell: pwsh
        run: python desktop/installer/make_icon.py desktop/installer/openrotas.ico

      - name: Baixar o bootstrapper do WebView2 Runtime (p/ o instalador garantir a janela nativa)
        shell: pwsh
        continue-on-error: true   # não-fatal: sem ele, o instalador compila e o app ainda abre no navegador
        run: |
          $url = "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          $out = "desktop/installer/MicrosoftEdgeWebview2Setup.exe"
          Write-Host "Baixando o WebView2 Evergreen Bootstrapper de $url"
          curl.exe -L --retry 4 --retry-delay 2 -o $out $url
          if (Test-Path $out) {
            $sz = (Get-Item $out).Length
            Write-Host "WebView2 bootstrapper baixado: $sz bytes"
            if ($sz -lt 100000) { Write-Warning "Arquivo suspeito (muito pequeno); o instalador vai ignorá-lo." ; Remove-Item $out }
          } else {
            Write-Warning "Não foi possível baixar o bootstrapper do WebView2; instalador seguirá sem ele."
          }

      - name: (Opcional) Embutir o grafo OSRM do Brasil
        if: ${{ github.event.inputs.embed_graph == 'true' }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.graph_tag }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/brazil-osrm-mld.tar.gz"
          Write-Host "Baixando grafo de $url"
          New-Item -ItemType Directory -Force -Path desktop/data_local | Out-Null
          curl.exe -L --retry 3 -o desktop/data_local/brazil-osrm-mld.tar.gz $url
          tar -xzf desktop/data_local/brazil-osrm-mld.tar.gz -C desktop/data_local
          Remove-Item desktop/data_local/brazil-osrm-mld.tar.gz
          Get-ChildItem desktop/data_local | Select-Object Name,Length

      - name: Baixar o MOTOR OSRM NATIVO (sem Docker) para Windows — e-kotov/osrm-binaries
        shell: pwsh
        continue-on-error: true   # não-fatal: sem o binário, o app cai no Docker/OSRM público (zero regressão)
        env:
          GH_TOKEN: ${{ github.token }}
          OSRM_BIN_TAG: ${{ github.event.inputs.osrm_bin_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = if ($env:OSRM_BIN_TAG) { $env:OSRM_BIN_TAG } else { "v6.0.0" }
          $hdr = @{ "User-Agent" = "OpenRotas-Build"; "Accept" = "application/vnd.github+json" }
          if ($env:GH_TOKEN) { $hdr["Authorization"] = "Bearer $env:GH_TOKEN" }
          Write-Host "Buscando release $tag de e-kotov/osrm-binaries"
          $rel = Invoke-RestMethod -Headers $hdr "https://api.github.com/repos/e-kotov/osrm-binaries/releases/tags/$tag"
          # Escolhe o asset do Windows x64 (osrm-<ver>-win32-x64-Release.tar.gz).
          $asset = $rel.assets | Where-Object { $_.name -match "win32-x64" -and $_.name -match "\.(tar\.gz|zip)$" } | Select-Object -First 1
          if (-not $asset) { Write-Warning "Asset Windows x64 nao encontrado no release $tag - build seguira sem motor nativo."; exit 0 }
          Write-Host "Baixando $($asset.name) ($([math]::Round($asset.size/1MB,1)) MB)"
          curl.exe -L --retry 4 --retry-delay 2 -o osrm-win.archive $asset.browser_download_url
          New-Item -ItemType Directory -Force -Path _osrm_extract | Out-Null
          if ($asset.name -match "\.zip$") { Expand-Archive -Path osrm-win.archive -DestinationPath _osrm_extract -Force }
          else { tar -xzf osrm-win.archive -C _osrm_extract }
          $routed = Get-ChildItem -Recurse -Filter osrm-routed.exe _osrm_extract | Select-Object -First 1
          if (-not $routed) { Write-Warning "osrm-routed.exe nao encontrado no pacote - build seguira sem motor nativo."; exit 0 }
          New-Item -ItemType Directory -Force -Path desktop/engines/bin | Out-Null
          # Copia o osrm-routed.exe E TUDO ao lado dele (DLLs de runtime: TBB/bz2/etc., que o e-kotov inclui).
          Copy-Item (Join-Path $routed.DirectoryName '*') -Destination desktop/engines/bin -Recurse -Force
          Write-Host "Conteudo de desktop/engines/bin:"
          Get-ChildItem desktop/engines/bin | Select-Object Name,Length | Format-Table -AutoSize
          # Sanidade (nao-fatal): o binario inicia e carrega as DLLs?
          try { & "desktop/engines/bin/osrm-routed.exe" --version 2>&1 | Select-Object -First 3 } catch { Write-Warning "osrm-routed --version falhou (pode faltar DLL); verifique o pacote." }

      - name: Embutir configuração padrão (turnkey — Supabase) a partir de SECRETS
        shell: pwsh
        env:
          ORK_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ORK_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ORK_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Motor de rotas DEDICADO (turnkey — acelera o lote). Opcional: se o secret OSRM_URL
          # não existir, o passo embute só o Supabase e o app segue no OSRM público (como antes).
          ORK_OSRM_URL: ${{ secrets.OSRM_URL }}
          ORK_VALHALLA_URL: ${{ secrets.VALHALLA_URL }}
          ORK_GRAPHHOPPER_URL: ${{ secrets.GRAPHHOPPER_URL }}
        run: |
          # Gera desktop/config/_config_padrao.ork (blob ofuscado) SE os secrets existirem.
          # Sem secrets, não gera nada e o instalador sai "não-turnkey" (usa o desktop.json).
          python desktop/installer/gerar_config_padrao.py

      - name: Empacotar (PyInstaller onedir)
        id: pyinstaller
        working-directory: desktop
        shell: pwsh
        run: |
          python -m PyInstaller packaging/launcher.spec --noconfirm `
            --distpath build/dist --workpath build/work 2>&1 | Tee-Object -FilePath build_pyinstaller.log
          if (-not (Test-Path "build/dist/OpenRotas/OpenRotas.exe")) {
            Write-Error "PyInstaller não gerou OpenRotas.exe (ver build_pyinstaller.log)"
          }

      - name: Log do PyInstaller (sempre, útil se falhar)
        if: always()
        continue-on-error: true   # diagnóstico: uma falha de upload (ex.: cota) NUNCA pode barrar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: desktop/build_pyinstaller.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Pasta do programa (onedir — fallback SÓ quando o build falha)
        # Só guarda o onedir (~1,6 GB) quando algo DEU ERRADO e o exe existe (p/ depurar). Em build
        # verde, não guarda nada: evita encher a cota de artefatos (era a causa da falha do build #18).
        if: failure() && steps.pyinstaller.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: OpenRotas-onedir
          path: desktop/build/dist/OpenRotas/**
          if-no-files-found: warn
          retention-days: 5

      - name: Validar bundle (autodiagnóstico)
        working-directory: desktop
        shell: pwsh
        continue-on-error: true
        run: |
          & "build/dist/OpenRotas/OpenRotas.exe" --diagnostico --silencioso
          Write-Host "diagnóstico exit code: $LASTEXITCODE"

      - name: Gerar instalador (Inno Setup)
        working-directory: desktop
        shell: pwsh
        run: |
          # Versão do instalador = desktop_config.APP_VERSION (fonte única — §19/§38).
          $ver = python -c "import sys; sys.path.insert(0,'app'); import desktop_config as c; print(c.APP_VERSION)"
          if (-not $ver) { $ver = "0.1.0" }
          Write-Host "Instalador versao $ver"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer/openrotas.iss

      - name: Publicar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: OpenRotas-Setup
          path: desktop/installer/dist_installer/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Ler a versão do app (fonte única = desktop_config.APP_VERSION)
        if: ${{ github.event.inputs.publicar_release == 'true' }}
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0,'desktop/app'); import desktop_config as c; print(c.APP_VERSION)"
          echo "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "Versão do app: $v"

      - name: Publicar na Release do app (habilita o auto-update §19)
        if: ${{ github.event.inputs.publicar_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.app_release_tag }}
          name: ${{ env.APP_VERSION }}
          body: >
            Instalador do OpenRotas Desktop (versão ${{ env.APP_VERSION }}). O app verifica esta
            Release para avisar sobre novas versões (app_update.py). Baixe o OpenRotas Setup.exe.
          files: desktop/installer/dist_installer/*.exe
          fail_on_unmatched_files: true
