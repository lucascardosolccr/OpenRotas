# ============================================================================
#  OpenRotas — CI de TESTES. Roda a suíte pytest (app web + edição desktop) a
#  cada push nas branches de trabalho e em pull requests, pegando regressões
#  automaticamente — até aqui a validação "zero regressão" era só manual.
# ============================================================================
name: tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# Cancela execuções antigas da mesma branch quando chega um push novo.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (inclui as bases embarcadas usadas pelos testes)
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reassemblar bases nacionais grandes (drenagem/rodovias)
        run: python montar_bases_grandes.py

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compilar (sanity de sintaxe) streamlit_app + desktop
        run: |
          python -m py_compile streamlit_app.py
          python -m compileall -q desktop

      - name: Rodar a suíte completa
        env:
          OPENROTAS_NO_NET: "1"      # diagnóstico do desktop não bate na rede no CI
        run: python -m pytest -q
