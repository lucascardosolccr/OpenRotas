# ============================================================================
#  OpenRotas — build do GRAFO OSRM do Brasil na nuvem (grátis, sem PC, sem cartão).
#
#  Roda num runner LINUX do GitHub, baixa o mapa do Brasil (Geofabrik), processa com o OSRM
#  (extract/partition/customize MLD via Docker) e publica o "brazil-osrm-mld.tar.gz" como
#  asset de uma Release. O desktop consome esse arquivo (config osrm.graph_url) e o serve
#  localmente via Docker — roteamento rápido e OFFLINE.
#
#  Como usar: Actions → "build-osrm-graph" → Run workflow. Leva ~30-60 min (pesado).
#  Depois, em osrm.graph_url do desktop.json, use a URL do asset da Release gerada.
# ============================================================================
name: build-osrm-graph

on:
  workflow_dispatch:
    inputs:
      pbf_url:
        description: "URL do .osm.pbf de origem (Geofabrik)"
        default: "https://download.geofabrik.de/south-america/brazil-latest.osm.pbf"
        required: true
      release_tag:
        description: "Tag da Release onde publicar o grafo"
        default: "osrm-brasil-latest"
        required: true
      osrm_image:
        description: "Imagem Docker do OSRM (DEVE casar com a VERSÃO do binário nativo embarcado no desktop — ver osrm_bin_tag em build-desktop). v5.27.1: o Brasil inteiro em v6.0.0 estoura a memória do runner grátis (OOM); o 5.x é bem mais leve e já construiu aqui."
        default: "ghcr.io/project-osrm/osrm-backend:v5.27.1"
        required: true

permissions:
  contents: write   # necessário para criar/atualizar a Release

jobs:
  graph:
    runs-on: ubuntu-latest
    # O build do Brasil inteiro, apoiado em swap, é LENTO: a tentativa anterior bateu no limite
    # de 120 min durante o osrm-extract. Damos a folga máxima do GitHub (6 h) para concluir.
    timeout-minutes: 350
    steps:
      - name: Liberar espaço em disco (o grafo do Brasil é grande)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/az /usr/share/swift || true
          docker image prune -af || true
          echo "=== disco após limpeza ===" ; df -h / /mnt

      - name: Aumentar memória virtual (swap) — dimensionado e DEFENSIVO (OSRM v6 estoura memória)
        run: |
          # O OSRM v6.0.0 consome MAIS memória que o v5.25.0 (OOM/exit 137 no osrm-extract do Brasil
          # com 7 GB RAM + 18 GB swap). Builds #8/#9 falhavam em ~1s no fallocate (/ sem espaço; e o
          # /mnt pode NÃO suportar fallocate). Correção robusta: dimensiona o swap pelo espaço REAL
          # livre, cai p/ `dd` se o fallocate falhar, protege cada comando e NUNCA derruba o passo
          # (termina em `true`) — assim sempre vemos df/free e o build segue com o swap possível.
          set -x
          echo "=== disco/memória ANTES ==="; df -h / /mnt || true; free -h || true
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          mk_swap() {   # $1=caminho  $2=tamanho_GB
            local p="$1" g="$2"
            if [ "${g:-0}" -lt 6 ]; then echo "swap $p pulado (tamanho ${g:-0} GB)"; return 0; fi
            if ! (sudo fallocate -l ${g}G "$p" 2>/dev/null); then
              echo "fallocate falhou em $p; tentando dd..."
              sudo dd if=/dev/zero of="$p" bs=1M count=$((g*1024)) status=none 2>/dev/null || { echo "alocação falhou em $p"; sudo rm -f "$p" || true; return 0; }
            fi
            sudo chmod 600 "$p" && sudo mkswap "$p" >/dev/null 2>&1 && sudo swapon "$p" && echo "swap LIGADO: $p ${g}G" || { echo "mkswap/swapon falhou em $p"; sudo rm -f "$p" || true; }
          }
          mnt_av=$(df -BG --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9'); mnt_av=${mnt_av:-0}
          root_av=$(df -BG --output=avail /  2>/dev/null | tail -1 | tr -dc '0-9'); root_av=${root_av:-0}
          mnt_swap=$(( mnt_av - 22 )); [ "$mnt_swap" -gt 40 ] && mnt_swap=40; [ "$mnt_swap" -lt 0 ] && mnt_swap=0
          root_swap=$(( root_av - 10 )); [ "$root_swap" -gt 22 ] && root_swap=22; [ "$root_swap" -lt 0 ] && root_swap=0
          echo "livre: /mnt=${mnt_av}G (swap ${mnt_swap}G)  /=${root_av}G (swap ${root_swap}G)"
          mk_swap /mnt/swapfile "$mnt_swap"
          mk_swap /swapfile "$root_swap"
          echo "=== swap ATIVO ==="; swapon --show || true; free -h || true; df -h / /mnt || true
          true   # nunca falha este passo: o build segue com o swap que conseguiu

      - name: Baixar o mapa do Brasil (no disco grande /mnt)
        run: |
          # Processa em /mnt (≈80 GB livres), não em / (volume menor): evita ficar sem espaço
          # nos arquivos intermediários .osrm* do país inteiro.
          sudo mkdir -p /mnt/osrm && sudo chown "$USER" /mnt/osrm
          cd /mnt/osrm
          curl -L --retry 3 -o brazil-latest.osm.pbf "${{ github.event.inputs.pbf_url }}"
          ls -lh ; df -h /mnt

      # Fases separadas para pinpoint do que falhar, com disco/memória entre elas.
      - name: OSRM extract (MLD)
        run: |
          cd /mnt/osrm
          docker run --rm -t -v "$PWD:/data" "${{ github.event.inputs.osrm_image }}" \
            osrm-extract -p /opt/car.lua /data/brazil-latest.osm.pbf
          rm -f brazil-latest.osm.pbf          # libera ~1,5 GB antes de particionar
          echo "=== após extract ===" ; free -h ; df -h /mnt

      - name: OSRM partition (MLD)
        run: |
          cd /mnt/osrm
          docker run --rm -t -v "$PWD:/data" "${{ github.event.inputs.osrm_image }}" \
            osrm-partition /data/brazil-latest.osrm
          echo "=== após partition ===" ; free -h ; df -h /mnt

      - name: OSRM customize (MLD)
        run: |
          cd /mnt/osrm
          docker run --rm -t -v "$PWD:/data" "${{ github.event.inputs.osrm_image }}" \
            osrm-customize /data/brazil-latest.osrm
          echo "=== após customize ===" ; free -h ; df -h /mnt

      - name: Empacotar o grafo (stream tar|gzip|split — sem arquivo intermediário)
        run: |
          # As 3ª/4ª tentativas falharam SÓ aqui (tar exit 2 = disco cheio): guardar o .tar.gz
          # inteiro de vários GB junto da fonte estourava o volume. Correção definitiva:
          #  • libera os DOIS swapfiles (/ e /mnt, ~48 GB), pois as fases de memória já acabaram —
          #    reclamando espaço em AMBOS os volumes antes de gravar as partes;
          #  • NÃO cria arquivo intermediário: faz tar|gzip|split em streaming, gravando partes
          #    de ≤1900 MB direto no volume RAIZ (fonte fica em /mnt) — nada precisa caber os
          #    dois no mesmo disco, e as partes respeitam o limite por-asset da Release;
          #  • escreve diagnóstico de disco/tamanhos no RESUMO do job (legível via API).
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          OUT="$GITHUB_WORKSPACE/release"; mkdir -p "$OUT"
          cd /mnt/osrm
          { echo "### Empacotamento do grafo";
            echo '```'; echo "-- disco antes --"; df -h / /mnt;
            echo "-- tamanho dos .osrm --"; du -sch brazil-latest.osrm* | tail -1; echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
          tar -cf - brazil-latest.osrm* | gzip | split -b 1900m -d -a 2 - "$OUT/brazil-osrm-mld.tar.gz.part"
          # manifesto simples das partes (para o desktop remontar em ordem)
          ( cd "$OUT" && ls -1 brazil-osrm-mld.tar.gz.part* | sort > brazil-osrm-mld.parts.txt )
          { echo '```'; echo "-- partes geradas --"; ls -lh "$OUT";
            echo "-- disco depois --"; df -h / /mnt; echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$OUT"

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "OSRM Brasil (MLD)"
          body: >
            Grafo rodoviário OSRM do Brasil (algoritmo MLD) para a edição desktop do OpenRotas.
            Publicado em PARTES (brazil-osrm-mld.tar.gz.partNN) para respeitar o limite por asset;
            o app baixa todas as partes, concatena e extrai. Consuma via osrm.graph_url (aponte para
            brazil-osrm-mld.tar.gz.part — o app detecta e baixa as demais).
          files: |
            release/brazil-osrm-mld.tar.gz.part*
            release/brazil-osrm-mld.parts.txt
          fail_on_unmatched_files: true
